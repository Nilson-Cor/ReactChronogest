version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: chronogest_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: chronogest_bd
      MYSQL_USER: chronogest
      MYSQL_PASSWORD: chronogest123
    ports:
      - "3306:3306"
    volumes:
      - ./chronogest_react.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    networks:
      - chronogest_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: chronogest_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - chronogest_network

  frontend:
    build:
      context: ./frontend
    container_name: chronogest_frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - chronogest_network

volumes:
  mysql_data:

networks:
  chronogest_network:
    driver: bridge
