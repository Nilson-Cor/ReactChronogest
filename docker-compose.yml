version: '3.8'

services:
  # Servicio de MySQL
  mysql:
    image: mysql:8.0
    container_name: chronogest_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: chronogest_bd
      MYSQL_USER: chronogest
      MYSQL_PASSWORD: chronogest123
    ports:
      - "3306:3306"
    volumes:
      # Importa automáticamente el SQL al iniciar
      - ./chronogest_react.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Persiste los datos
      - mysql_data:/var/lib/mysql
    networks:
      - chronogest_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio del Backend
  backend:
    build: ./backend
    container_name: chronogest_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_USER: chronogest
      DB_PASSWORD: chronogest123
      DB_NAME: chronogest_bd
      DB_PORT: 3306
      PORT: 5000
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - chronogest_network

  # Servicio del Frontend (opcional)
  frontend:
    build: ./frontend
    container_name: chronogest_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - chronogest_network
    depends_on:
      - backend

volumes:
  mysql_data:

networks:
  chronogest_network:
    driver: bridge